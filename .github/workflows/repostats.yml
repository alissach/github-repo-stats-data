# Collects daily GitHub traffic stats (views, clones, referrers) for each repo
# below, past GitHub's 14-day retention window, and builds an HTML/PDF report
# per repo on the `github-repo-stats` branch of this repo.
# See https://github.com/jgehrcke/github-repo-stats
name: fetch-repository-stats
concurrency: fetch-repository-stats

on:
  schedule:
    # Once a day at 23:00 UTC
    - cron: "0 23 * * *"
  workflow_dispatch:

jobs:
  run-ghrs-with-matrix:
    name: repostats
    runs-on: ubuntu-latest
    strategy:
      matrix:
        statsRepo:
          - alissach/job-scraper-to-airtable
          - alissach/chrome-url-redirect
          - alissach/browser-disable-ctrl-scroll-zoom
      fail-fast: false
      # One at a time so concurrent runs don't race pushing to the data branch
      max-parallel: 1
    steps:
      - name: run-ghrs
        uses: jgehrcke/github-repo-stats@RELEASE
        with:
          repository: ${{ matrix.statsRepo }}
          ghtoken: ${{ secrets.ghrs_github_api_token }}
          # Makes the per-repo README on the data branch link to the Pages-hosted report
          ghpagesprefix: https://alissach.github.io/github-repo-stats-data

  # The action rebuilds report.html from scratch each run, so re-add the
  # plain-language chart explanations after all repos are done
  add-explanations:
    needs: run-ghrs-with-matrix
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          path: main
      - uses: actions/checkout@v4
        with:
          ref: github-repo-stats
          path: data
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: annotate reports
        run: python main/scripts/add_explanations.py data
      - name: commit and push
        working-directory: data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Add chart explanations to reports"
          git push
